name: Publish scheduled blog post
# Runs on GitHub's servers: no app open, no approval prompts.
# 13:20 UTC = 7:20am Central (standard time). GitHub can drop or delay a timed
# run (it dropped the first one, 11/19), so backup runs follow through the day.
# scripts/last_published.txt keeps it to one post per Central day.
on:
  schedule:
    - cron: "20 13 * * *"
    - cron: "50 14 * * *"
    - cron: "20 16 * * *"
    - cron: "50 18 * * *"
    - cron: "20 21 * * *"
  workflow_dispatch:
  push:
    branches: [scheduler-test]
permissions:
  contents: write
concurrency:
  group: blog-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pub
        env:
          PUBLISH_DATE: ${{ github.ref_name == 'scheduler-test' && '2099-01-01' || '' }}
        run: python scripts/publish_scheduled.py
      - if: steps.pub.outputs.slug != ''
        run: |
          git config user.name "TradeGOAT scheduler"
          git config user.email "travis@thetradegoat.com"
          git add -A
          git commit -m "Blog: publish scheduled post ${{ steps.pub.outputs.slug }}"
          git pull --rebase
          git push
